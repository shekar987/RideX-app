<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- viewport-fit=cover lets the app paint under the notch; safe-area padding
         (pt-safe / pb-safe utilities) keeps content out of it. Zoom is NOT blocked. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="RideX — book a ride in seconds, track your driver in real time." />

    <!-- Installed-app (PWA) behaviour. The status bar is opaque black (matches the
         app background) so page content starts BELOW it on iPhone; only the bottom
         home-indicator inset applies, which every page already pads with pb-safe.
         Do not switch to black-translucent unless every page header gets pt-safe. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="RideX" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Resource hints — resolve DNS / open connections for third-party origins
         before the JS that needs them loads. preconnect = full TCP+TLS handshake;
         dns-prefetch = cheaper fallback for browsers without preconnect. -->

    <!-- Firebase / Google APIs -->
    <link rel="preconnect" href="https://apis.google.com" />
    <link rel="dns-prefetch" href="https://apis.google.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />

    <!-- Stripe -->
    <link rel="preconnect" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />

    <!-- Mapbox (map style, tiles and geocoding on the booking path) -->
    <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link rel="dns-prefetch" href="https://events.mapbox.com" />

    <title>RideX</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
